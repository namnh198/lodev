; lodev's PHP defaults (web and CLI); a project's .lodev/php/*.ini overrides them.
display_errors=On
display_startup_errors=On
error_reporting=E_ALL
memory_limit=-1
session.gc_maxlifetime=432000
session.upload_progress.enabled=Off
output_buffering=Off
zlib.output_compression=Off
max_execution_time=360
max_file_uploads=1000
max_input_time=3600
post_max_size=1024M
max_input_vars=100000
upload_max_filesize=1024M
; Sized for Magento (60k+ PHP files): the defaults (10000 files, 128M) keep evicting it.
; validate_timestamps stays on (PHP's default): an edited file is picked up within opcache.revalidate_freq (2 s;
; 0 would stat every file on every request over the macOS bind mount).
opcache.memory_consumption=512
opcache.max_accelerated_files=130000
opcache.interned_strings_buffer=32
realpath_cache_size=10M
realpath_cache_ttl=600
; The project's .lodev/php/prepend.php, created by `lodev start`.
auto_prepend_file=/etc/lodev/php.d/prepend.php

[mailpit]
sendmail_path="/usr/local/bin/mailpit sendmail -S mailpit:1025"
