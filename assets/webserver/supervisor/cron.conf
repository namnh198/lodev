[program:cron]
command=/usr/local/bin/supercronic /etc/lodev/crontab
directory=%(ENV_LODEV_WORKDIR)s
user=%(ENV_LODEV_USER)s
; supervisord does not set HOME for user=; composer and wp need it.
environment=HOME="/home/%(ENV_LODEV_USER)s",USER="%(ENV_LODEV_USER)s"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
