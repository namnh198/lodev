# lodev: the healthcheck's /phpstatus on 127.0.0.1, whatever the project's webserver config is.
# Requests to 127.0.0.1 land here (the more specific address); everything but /phpstatus goes on
# to the project's server through 127.0.0.2, so `curl http://127.0.0.1/...` keeps working.
server {
    listen 127.0.0.1:80;
    server_name _;
    access_log off;
    location = /phpstatus {
        allow 127.0.0.1;
        deny all;
        include fastcgi_params;
        # php-fpm matches pm.status_path on the script; Debian's fastcgi_params does not set it.
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }
    location / {
        proxy_pass http://127.0.0.2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }
}
