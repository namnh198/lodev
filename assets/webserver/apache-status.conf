# lodev: the healthcheck's /phpstatus on 127.0.0.1, whatever the project's vhost is.
# Requests to 127.0.0.1 match this vhost (the more specific address); everything but /phpstatus
# goes on to the project's vhost through 127.0.0.2, so `curl http://127.0.0.1/...` keeps working.
<VirtualHost 127.0.0.1:80>
    ProxyPreserveHost On
    <Location "/phpstatus">
        Require ip 127.0.0.1
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </Location>
    ProxyPass /phpstatus !
    ProxyPass / http://127.0.0.2/
    ProxyPassReverse / http://127.0.0.2/
</VirtualHost>
