name: Nightly

# Every push to main replaces the rolling `nightly` pre-release with a fresh build.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      # Files are named lodev_nightly_<os>_<arch>; the binary reports `git describe` and knows it is nightly.
      - run: make dist VERSION="$(git describe --tags --match 'v*' --always)" VER=nightly CHANNEL=nightly
      - name: Update the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Pre-release built from $GITHUB_SHA on main. Install: \`curl -fsSL https://raw.githubusercontent.com/namnh198/lodev/main/install.sh | VERSION=nightly sh\` or \`lodev self-upgrade --version nightly\`."
          if gh release view nightly >/dev/null 2>&1; then
            # Update in place, never delete: a failed step must not leave nightly users with a 404.
            git push -f origin "$GITHUB_SHA:refs/tags/nightly"
            gh release edit nightly --prerelease --latest=false --notes "$notes"
            gh release upload nightly dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber
          else
            gh release create nightly --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "nightly" --notes "$notes" dist/*.tar.gz dist/*.zip dist/checksums.txt
          fi
