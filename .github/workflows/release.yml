name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: make packages VERSION="$GITHUB_REF_NAME" # env var, not ${{ }}: no shell injection from tag names
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=
          case "$GITHUB_REF_NAME" in *-*) flags=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" $flags \
            --title "$GITHUB_REF_NAME" --generate-notes \
            dist/*.tar.gz dist/*.zip dist/*.deb dist/checksums.txt \
            dist/packaging/lodev.rb dist/packaging/PKGBUILD dist/packaging/.SRCINFO
