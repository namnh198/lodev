name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: make packages VERSION="$GITHUB_REF_NAME" # env var, not ${{ }}: no shell injection from tag names
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=
          case "$GITHUB_REF_NAME" in *-*) flags=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" $flags \
            --title "$GITHUB_REF_NAME" --generate-notes \
            dist/*.tar.gz dist/*.zip dist/*.deb dist/checksums.txt \
            dist/packaging/lodev.rb dist/packaging/PKGBUILD dist/packaging/.SRCINFO

  # Stable releases only (no "-" in the tag): lodev of that version pulls this image instead of
  # building it. Each arch builds natively and is pushed by digest; image-tag joins them under one tag.
  image:
    if: ${{ !contains(github.ref_name, '-') }}
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # lodev's own label and build args, so a pulled image passes lodev's hash check.
          args=(); while IFS= read -r a; do args+=("$a"); done < <(go run ./tools/webimage)
          docker buildx build "${args[@]}" --platform "$PLATFORM" --metadata-file meta.json \
            --output "type=image,name=ghcr.io/namnh198/lodev-webserver,push-by-digest=true,name-canonical=true,push=true" \
            assets/webserver
          mkdir -p digests
          digest=$(jq -r '."containerimage.digest"' meta.json)
          touch "digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  image-tag:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch image
        working-directory: digests
        run: |
          docker buildx imagetools create -t "ghcr.io/namnh198/lodev-webserver:$GITHUB_REF_NAME" \
            $(printf 'ghcr.io/namnh198/lodev-webserver@sha256:%s ' *)
          docker buildx imagetools inspect "ghcr.io/namnh198/lodev-webserver:$GITHUB_REF_NAME"
