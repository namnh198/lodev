name: Edge

# Every push to main replaces the rolling `edge` pre-release with a fresh build.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: edge
  cancel-in-progress: true

jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      # Files are named lodev_edge_<os>_<arch>; the binary reports `git describe` and knows it is edge.
      - run: make dist VERSION="$(git describe --tags --match 'v*' --always)" VER=edge CHANNEL=edge
      - name: Update the edge pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Pre-release built from $GITHUB_SHA on main. Install: \`curl -fsSL https://raw.githubusercontent.com/namnh198/lodev/main/install.sh | VERSION=edge sh\` or \`lodev self-upgrade --version edge\`."
          if gh release view edge >/dev/null 2>&1; then
            # Update in place, never delete: a failed step must not leave edge users with a 404.
            git push -f origin "$GITHUB_SHA:refs/tags/edge"
            gh release edit edge --prerelease --latest=false --notes "$notes"
            gh release upload edge dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber
          else
            gh release create edge --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "edge" --notes "$notes" dist/*.tar.gz dist/*.zip dist/checksums.txt
          fi
