name: Docs

# Checks the site builds and every internal link resolves. Cloudflare Workers Builds
# deploys it from main (see docs/contents/contributing/docs-site.md).
on:
  push:
    branches: [main]
    paths: ['docs/**', '!docs/superpowers/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', '!docs/superpowers/**', '.github/workflows/docs.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: docs/.node-version
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build # also fails on a broken internal link or anchor
        working-directory: docs
