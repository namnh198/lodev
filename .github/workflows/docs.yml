name: Docs

# Checks the site builds and every internal link resolves. Cloudflare Workers Builds
# deploys it from main (see docs/contents/contributing/docs-site.md).
on:
  push:
    branches: [main]
    paths: ['docs/**', '!docs/superpowers/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', '!docs/superpowers/**', '.github/workflows/docs.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: docs/.node-version
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: docs
      - run: pnpm run build # also fails on a broken internal link or anchor
        working-directory: docs
